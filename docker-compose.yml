services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: clothing_platform
      POSTGRES_USER: ${DB_USERNAME:postgres.whofaxgzmkvaildekrle}
      POSTGRES_PASSWORD: ${DB_PASSWORD:nevEi1pTtYUnJknH}
