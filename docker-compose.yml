services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: clothing_platform
      POSTGRES_USER: ${DB_USERNAME:-clothing}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-clothing}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  mailpit:                       # local SMTP sink: http://localhost:8025
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata:
