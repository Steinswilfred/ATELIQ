spring:
  application:
    name: clothing-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clothing_platform}
    username: ${DB_USERNAME:clothing}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, never by Hibernate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    default-property-inclusion: non_null
server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: never
app:
  environment: ${APP_ENV:dev}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: PT15M
    refresh-token-ttl: P14D
