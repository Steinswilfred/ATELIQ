
spring:
  application:
    name: clothing-platform

  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:5432/postgres?currentSchema=clothing_platform}
    username: ${DB_USERNAME:postgres.whofaxgzmkvaildekrle}
    password: ${DB_PASSWORD:nevEi1pTtYUnJknH}
    driver-class-name: org.postgresql.Driver

    # IMPORTANT: Limit Supabase connections
    hikari:
      pool-name: ATELIQ-HikariPool
      maximum-pool-size: 2
      minimum-idle: 0
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 600000
      validation-timeout: 5000

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.default_schema: clothing_platform

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: clothing_platform
    schemas: clothing_platform
    create-schemas: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:steinswilfred5@gmail.com}
    password: ${MAIL_PASSWORD:ovtupbpkxgvudqrx}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 20000
          timeout: 20000
          writetimeout: 20000
          ssl:
            trust: smtp.gmail.com

server:
  port: ${PORT:10000}
  address: 0.0.0.0

app:
