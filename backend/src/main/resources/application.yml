spring:
  application:
    name: clothing-platform

  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:5432/postgres?currentSchema=clothing_platform}
    username: ${DB_USERNAME:postgres.whofaxgzmkvaildekrle}
    password: ${DB_PASSWORD:nevEi1pTtYUnJknH}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: ATELIQ-HikariPool
      maximum-pool-size: 2
      minimum-idle: 0
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 600000
      validation-timeout: 5000

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_schema: clothing_platform

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: clothing_platform
    schemas: clothing_platform
    create-schemas: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:steinswilfred5@gmail.com}
    password: ${MAIL_PASSWORD:ovtupbpkxgvudqrx}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 20000
          timeout: 20000
          writetimeout: 20000
          ssl:
            trust: smtp.gmail.com

server:
  port: ${PORT:10000}
  address: 0.0.0.0
  shutdown: graceful

  compression:
    enabled: true
    mime-types:
      - application/json
      - application/javascript
      - text/html
      - text/css
      - text/plain
    min-response-size: 1024

  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

app:
  frontend-url: ${FRONTEND_URL:https://ateliq-two.vercel.app}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://ateliq-two.vercel.app}

  jwt:
    secret: ${JWT_SECRET:7fK9mP2xQ8vR4nT6wY3bL1cH5jD0sA9z}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
    cookie-secure: ${COOKIE_SECURE:true}

  bootstrap:
    super-admin-email: ${SUPER_ADMIN_EMAIL:steinswilfred5@gmail.com}
    super-admin-password: ${SUPER_ADMIN_PASSWORD:Steins@20021234}

  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_TT8KBze2YOz2uy}
    key-secret: ${RAZORPAY_KEY_SECRET:tJw5tzhUVQHIRdBfEjoTgYzD}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:clothing-platform-webhook}

  app:
  storage:
    provider: supabase
    supabase:
      url: ${SUPABASE_URL}
      secret-key: ${SUPABASE_SERVICE_ROLE_KEY}
      bucket: ${SUPABASE_STORAGE_BUCKET:product-media}

  sms:
    provider: ${SMS_PROVIDER:log}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO

    com.clothingplatform: INFO

    org.springframework.web: INFO

    org.springframework.security: INFO

    com.zaxxer.hikari: INFO

    org.hibernate.SQL: WARN

    org.flywaydb: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
